      ['-b', '粘贴剪贴板中已记录的生物群系。可先用 //copy -b 复制群系。'],

    examples: ['//paste -a', '//paste -a -s', '//paste -n -o']

const commandFamilies = new Map();
for (const [name, entries] of Object.entries(groups)) {
  for (const [command, description] of entries) {
    const words = command.split(' ');
    const key = words[0].startsWith('//') && words[0] !== '//schem'
      ? words[0]
      : ['/brush', '/tool', '//schem'].includes(words[0])
        ? words.slice(0, 2).join(' ')
        : words[0];
    if (!commandFamilies.has(key)) commandFamilies.set(key, { name, entries: [] });
    commandFamilies.get(key).entries.push([command, description]);
  }
}

  '历史与帮助': '//undo //redo //help'
};

const directions = { east: '东', west: '西', north: '北', south: '南', up: '上', down: '下' };
const flag = (name, label) => ({ label: name + ' · ' + label, flag: name, type: 'checkbox' });
const input = (label, value = '', prefix = '') => ({ label, value, prefix });
const number = (label, value, min = 1) => ({ label, value, min, type: 'number' });
const direction = (value = 'east') => ({ label: '方向', value, options: directions });
const materials = value => input('材料或方块模式', value);
const air = flag('-a', '跳过空气');
const entities = flag('-e', '包含实体');
const biomes = flag('-b', '包含生物群系');
const source = input('来源遮罩（可选）', '', '-m');
const coordinates = input('坐标 x,y,z（留空使用当前位置）');
const heightMap = input('地表高度遮罩（可选）');
const builders = {
  '//pos1': [coordinates], '//pos2': [coordinates],
  '//sel': [{ label: '选区形状', value: '', options: {
    '': '清除选区', cuboid: '长方体', poly: '多边形柱体', ellipsoid: '椭球', sphere: '球体', cyl: '圆柱'
  } }],
  '//expand': [{ label: '扩展方式', value: 'direction', options: { direction: '指定方向', vert: '整个世界高度' } },
    number('扩展格数', 5), number('反向扩展格数', 0, 0), direction('up')],
  '//shift': [number('移动格数', 5), direction()],
  '//contract': [number('收缩格数', 3), direction('up')],
  '//inset': [number('缩小格数', 1)], '//outset': [number('扩大格数', 2)],
  '//count': [input('方块遮罩', 'stone')],
  '//undo': [number('撤销次数', 1)], '//redo': [number('重做次数', 1)],
  '//help': [input('命令名', 'paste')],
  '//set': [materials('stone')],
  '//replace': [input('来源遮罩（可选）'), materials('glass')],
  '//walls': [materials('stone_bricks')], '//faces': [materials('glass')],
  '//overlay': [materials('grass_block')], '//center': [materials('glowstone')],
  '//stack': [air, flag('-s', '选中最后一份副本'), entities, biomes,
    number('复制份数', 4), direction(), source],
  '//move': [air, flag('-s', '选中移动后的范围'), entities, biomes,
    number('移动格数', 5), direction('up'), input('原处填充材料（可选）'), source],
  '//copy': [entities, biomes, source], '//cut': [entities, biomes, input('原处填充材料（可选）'), source],
  '//paste': [air, flag('-s', '选中粘贴范围'), flag('-n', '只预览选区'),
    flag('-o', '原地粘贴'), entities, biomes, source],
  '//rotate': [number('Y 轴角度', 90, -360), number('X 轴角度', 0, -360), number('Z 轴角度', 0, -360)],
  '//flip': [direction()],
  '//schem save': [input('文件名', 'house')], '//schem load': [input('文件名', 'house')],
  '//sphere': [flag('-r', '抬高到球底'), materials('stone'), input('半径（单值或 X,Y,Z）', '5')],
  '//hsphere': [flag('-r', '抬高到球底'), materials('glass'), input('半径（单值或 X,Y,Z）', '5')],
  '//cyl': [materials('stone'), input('半径（单值或 X,Z）', '5'), number('高度', 8)],
  '//hcyl': [materials('glass'), input('半径（单值或 X,Z）', '5'), number('高度', 8)],
  '//line': [materials('stone'), number('半径', 2, 0)],
  '//smooth': [number('平滑轮数', 2), heightMap],
  '//fill': [materials('stone'), number('半径', 8), number('深度', 3)],
  '//fillr': [materials('dirt'), number('半径', 8), number('深度', 3)],
  '//drain': [flag('-w', '移除含水状态'), number('半径', 15)],
  '//regen': [flag('-c', '生成到剪贴板'), biomes, input('种子（可选）')],
  '//gmask': [input('全局遮罩（留空清除）', '#existing')],
  '/brush sphere': [flag('-h', '空心'), materials('stone'), number('半径', 3)],
  '/brush cylinder': [flag('-h', '空心'), materials('stone'), number('半径', 5), number('高度', 8)],
  '/brush smooth': [number('半径', 4), number('平滑轮数', 2), heightMap],
  '/brush clipboard': [air, entities, biomes, source],
  '/mask': [input('笔刷遮罩（留空清除）', 'stone,dirt')],
  '/range': [number('使用距离', 30)], '/size': [number('笔刷半径', 4)]
};
const builderStates = new Map();

function commandBuilder(key, fields) {
  const state = builderStates.get(key) ?? { values: [] };
  builderStates.set(key, state);
  const builder = document.createElement('section');
  builder.className = 'builder';


  const options = document.createElement('div');
  options.className = 'editor-options';
  const controls = fields.map((field, index) => {
    const control = document.createElement(field.options ? 'select' : 'input');
    if (field.options) {
      for (const [value, label] of Object.entries(field.options)) {
        const option = element('option', label);
        option.value = value;
        control.append(option);
      }
    } else {
      control.type = field.type ?? 'text';
      if (field.type === 'number') {
        control.step = '1';
        control.min = field.min;
        control.max = 2147483647;
        control.required = true;
      } else if (field.type !== 'checkbox') {
        control.required = Boolean(field.value) && !field.label.includes('留空');
      }
    }
    if (field.type === 'checkbox') control.checked = state.values[index] ?? false;
    else control.value = state.values[index] ?? field.value;
    const label = element('label', field.label + ' ');
    label.append(control);
    if (field.flag) label.className = 'flag-option';
    options.append(label);
    return control;
  });

  const row = document.createElement('div');
  const preview = element('code', '');
  const copy = element('button', '复制');
  const status = element('output', '');
  status.setAttribute('aria-live', 'polite');
  row.className = 'command-bar';
  preview.setAttribute('aria-live', 'polite');
  row.append(preview, copy);
  builder.append(row, options, status);

  function update() {
    const vertical = key === '//expand' && controls[0].value === 'vert';
    const parts = [key];
    let valid = true;
    fields.forEach((field, index) => {
      const control = controls[index];
      if (field.type === 'checkbox') {
        state.values[index] = control.checked;
        if (control.checked) parts.push(field.flag);
        return;
      }
      const value = control.value.trim();
      state.values[index] = control.value;
      if (key === '//expand') {
        control.disabled = index > 0 && vertical;
        if (control.disabled || (index === 0 && !vertical) || (index === 2 && value === '0')) return;
      }
      if (!control.validity.valid || (control.required && !value)) valid = false;
      if (value) {
        if (field.prefix) parts.push(field.prefix);
        parts.push(field.type === 'number' ? String(control.valueAsNumber) : value);
      }
    });
    copy.disabled = !valid;
    status.textContent = valid ? '' : '请检查必填项和数值范围。';
    preview.textContent = valid ? parts.join(' ') : key + ' …';
  }

  builder.addEventListener('input', update);
  copy.onclick = () => copyCommand(preview.textContent, preview);
  copy.setAttribute('aria-label', '复制生成的指令');
  update();
  return builder;
}


const search = document.querySelector('#search');
const dialog = document.querySelector('dialog');
const detail = document.querySelector('#detail');
const list = document.querySelector('#list');
const count = document.querySelector('#count');
const nav = document.querySelector('nav');
const categories = ['全部', ...Object.keys(catalog)];
let category = '全部';

function element(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}

async function copyCommand(command, code) {
  const feedback = document.querySelector('#feedback');
  try {
    await navigator.clipboard.writeText(command);
    feedback.textContent = '已复制 ' + command;
  } catch {
    const range = document.createRange();
    range.selectNodeContents(code);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    feedback.textContent = '已选中指令，请按 Ctrl+C 或 ⌘C 复制。';
  }
}

function commandBar(command) {
  const row = document.createElement('div');
  row.className = 'command-bar';
  const code = element('code', command);
  const copy = element('button', '复制');
  copy.onclick = () => copyCommand(command, code);
  row.append(code, copy);
  return row;
}

function openCommand(key, family, card) {
  document.querySelector('#command-title').textContent = key;
  const guide = parameterGuides[key];
  const fields = builders[key] ?? [];
  detail.replaceChildren();
  const reference = document.createElement('section');
  reference.append(element('p', descriptions[key]), element('h4', '语法与参数'));
  const syntax = guide?.syntax ?? [key, ...fields.map(field => {
    if (field.flag) return '[' + field.flag + ']';
    if (field.prefix) return '[' + field.prefix + ' <' + field.label.replace('（可选）', '') + '>]';
    const label = field.label.replace(/（.*）/, '');
    const required = ['//set', '//walls', '//faces', '//overlay', '//center', '//replace',
      '//sphere', '//hsphere', '//cyl', '//hcyl', '//line', '//fill', '//fillr',
      '/brush sphere', '/brush cylinder'].includes(key) && label === '材料或方块模式'
      || ['//count', '//schem save', '//schem load', '//drain', '/size', '/range'].includes(key)
      || (key === '//rotate' && label.startsWith('Y'));
    return required ? '<' + label + '>' : '[' + label + ']';
  })].join(' ');
  if (key === '//expand') {
    reference.append(element('code', '//expand <格数> [反向格数] [方向]'), element('p', '或使用 //expand vert 扩展到世界全高。'));
  } else {
    reference.append(element('code', syntax));
  }
  if (fields.length) {
    const parameters = document.createElement('dl');
    const options = guide?.options ?? fields.filter(field => field.flag || field.prefix).map(field => {
      if (field.flag) return [field.flag, field.label.split(' · ')[1]];
      return [field.prefix, '按来源遮罩限制参与操作的方块。'];
    });
    for (const [name, meaning] of options) {
      parameters.append(element('dt', name), element('dd', meaning));
    }
    reference.append(parameters);
  }
  reference.append(element('h4', '示例'));
  for (const [command, meaning] of family.entries) {
    const example = document.createElement('div');
    example.className = 'example';
    example.append(element('code', command), element('p', meaning));
    reference.append(example);
  }
  const editor = document.createElement('section');
  editor.className = 'editor';
  editor.append(fields.length ? commandBuilder(key, fields) : commandBar(key));
  const feedback = element('p', '');
  feedback.id = 'feedback';
  feedback.setAttribute('role', 'status');
  editor.append(feedback);
  detail.append(reference, editor);
  activeCard = card;
  dialog.showModal();
  detail.scrollTop = 0;
  playMorph(true);
}

let activeCard;
let transition;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function playMorph(opening) {
  if (transition) {
    if (!opening) {
      for (const animation of transition.animations) {
        if (animation.playbackRate > 0) animation.reverse();
      }
      transition.closing = true;
    }
    return;
  }
  if (reduceMotion.matches || !activeCard?.isConnected || !dialog.animate) {
    if (!opening) dialog.close();
    return;
  }
  const card = activeCard.getBoundingClientRect();
  const panel = dialog.getBoundingClientRect();
  if (!card.width || !panel.width || card.bottom < 0 || card.top > innerHeight) {
    if (!opening) dialog.close();
    return;
  }

  const surface = element('div', '');
  const label = element('div', '');
  label.append(activeCard.querySelector('code').cloneNode(true), activeCard.querySelector('span').cloneNode(true));
  surface.className = 'morph-surface';
  label.className = 'morph-label';
  surface.setAttribute('aria-hidden', 'true');
  surface.append(label);
  // A manual popover puts the animation above the modal in the top layer.
  const overlay = element('div', '');
  overlay.setAttribute('popover', 'manual');
  overlay.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;pointer-events:none;overflow:visible';
  if (!overlay.showPopover) {
    if (!opening) dialog.close();
    return;
  }
  overlay.append(surface);
  document.body.append(overlay);
  overlay.showPopover();
  dialog.classList.add('morphing');

  const frame = (rect, radius) => ({
    left: rect.left + 'px', top: rect.top + 'px',
    width: rect.width + 'px', height: rect.height + 'px', borderRadius: radius + 'px'
  });
  const settings = { duration: 220, easing: 'cubic-bezier(.22,.7,.25,1)', fill: 'both',
    direction: opening ? 'normal' : 'reverse' };
  const animations = [
    surface.animate([frame(card, 8), frame(panel, 14)], settings),
    label.animate([{ opacity: 1 }, { opacity: 0, offset: .5 }, { opacity: 0 }], settings),
    dialog.animate([{ opacity: 0 }, { opacity: 0, offset: .65 }, { opacity: 1 }], settings),
    surface.animate([{ opacity: 1 }, { opacity: 1, offset: .65 }, { opacity: 0 }], settings)
  ];
  const current = { animations, closing: !opening };
  transition = current;
  animations[0].onfinish = () => {
    if (current.closing) dialog.close();
    overlay.remove();
    dialog.classList.remove('morphing');
    for (const animation of animations) animation.cancel();
    transition = undefined;
  };
}

dialog.querySelector('form').addEventListener('submit', event => {
  event.preventDefault();
  playMorph(false);
});
dialog.addEventListener('cancel', event => {
  event.preventDefault();
  playMorph(false);
});

function isBackdrop(event) {
  if (event.target !== dialog) return false;
  const bounds = dialog.getBoundingClientRect();
  return event.clientX < bounds.left || event.clientX >= bounds.right ||
    event.clientY < bounds.top || event.clientY >= bounds.bottom;
}

let startedOnBackdrop = false;
dialog.addEventListener('pointerdown', event => {
  startedOnBackdrop = isBackdrop(event);
});
dialog.addEventListener('click', event => {
  if (startedOnBackdrop && isBackdrop(event)) playMorph(false);
  startedOnBackdrop = false;
});

function render() {
  list.replaceChildren();
  const tokens = search.value.trim().toLowerCase().split(/\s+/);
  let matches = 0;
  for (const [name, keys] of Object.entries(catalog)) {
    if (category !== '全部' && category !== name) continue;
    const section = document.createElement('section');
    section.className = 'category';
    const cards = document.createElement('div');
    cards.className = 'cards';
    for (const key of keys.split(keys.includes('|') ? '|' : ' ')) {
      const family = commandFamilies.get(key);
      const text = [name, descriptions[key], ...family.entries.flat(),
        ...(parameterGuides[key]?.options.flat() ?? []),
        ...(builders[key] ?? []).map(field => field.label)].join(' ').toLowerCase();
      if (!tokens.every(token => text.includes(token))) continue;
      const card = document.createElement('button');
      card.className = 'card';
      card.setAttribute('aria-haspopup', 'dialog');
      card.append(element('code', key), element('span', descriptions[key]));
      card.onclick = () => openCommand(key, family, card);
      cards.append(card);
      matches++;
    }
    if (cards.children.length) {
      section.append(element('h2', name), cards);
      list.append(section);
    }
  }
  count.textContent = matches ? matches + ' 个命令' : '没有找到匹配的命令。';
}

for (const name of categories) {
  const button = element('button', name);
  button.setAttribute('aria-pressed', String(name === category));
  button.onclick = () => {
    category = name;
    for (const item of nav.children) item.setAttribute('aria-pressed', String(item === button));
    render();
  };
  nav.append(button);
}
search.addEventListener('input', render);
render();
</script>
</html>
